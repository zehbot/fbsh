# Template only - the real secret is created from private/.env:
#
#   kubectl -n fbsh create secret generic fbsh-env \
#     --from-env-file=private/.env --dry-run=client -o yaml | kubectl apply -f -
#
# Values become environment variables in the pod and take precedence over any
# .env file inside the image.
apiVersion: v1
kind: Secret
metadata:
  name: fbsh-env
  namespace: fbsh
type: Opaque
stringData:
  FRITZ_HOST: fritz.box
  FRITZ_USER: hase10
  FRITZ_PASSWORD: change-me

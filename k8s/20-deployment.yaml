apiVersion: apps/v1
kind: Deployment
metadata:
  name: fbsh
  namespace: fbsh
  labels:
    app: fbsh
spec:
  replicas: 1
  strategy:
    type: Recreate          # one poller per box; no overlapping instances
  selector:
    matchLabels:
      app: fbsh
  template:
    metadata:
      labels:
        app: fbsh
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: fbsh
          image: inkassodeppen/fbsh:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["watch", "--interval", "60"]
          envFrom:
            - secretRef:
                name: fbsh-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          # No probes on purpose: every probe would talk to the FRITZ!Box and
          # add needless logins. The watch loop reconnects on its own.

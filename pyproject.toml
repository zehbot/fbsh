[project]
name = "fbsh"
version = "0.1.0"
description = "FRITZ!Box smart home control and monitoring (AHA-HTTP interface)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fbsh = "fbsh.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fbsh*"]
